<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07849e" />
    <title>댕다방 앱 새로고침</title>
    <style>
        :root { color-scheme: light; font-family: Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: #172033;
            background: linear-gradient(145deg, #e9fbff, #fff8ef 52%, #fff0f4);
        }
        main {
            width: min(100%, 440px);
            padding: 28px 24px;
            border: 1px solid rgba(8, 132, 158, 0.2);
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
            text-align: center;
        }
        img { width: 88px; height: 88px; border-radius: 50%; }
        h1 { margin: 18px 0 8px; font-size: 26px; }
        p { margin: 0; color: #526078; font-size: 15px; font-weight: 700; line-height: 1.65; }
        #status { margin-top: 20px; padding: 14px; border-radius: 16px; background: #eefbfe; color: #08687c; }
        .actions { display: grid; gap: 10px; margin-top: 20px; }
        button, a {
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 16px;
            padding: 0 18px;
            font: inherit;
            font-weight: 900;
            text-decoration: none;
            cursor: pointer;
        }
        a { color: #fff; background: linear-gradient(110deg, #07849e, #1747d1); }
        button { color: #42506a; background: #eef1f6; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <main>
        <img src="/images/pwa/icon-v2-192x192.png" alt="댕다방" />
        <h1>댕다방 앱 새로고침</h1>
        <p>바로가기 앱에 남은 이전 화면만 지우고<br />최신 앱 화면으로 다시 연결합니다.</p>
        <p id="status" role="status" aria-live="polite">최신 앱을 준비하고 있어요…</p>
        <div class="actions">
            <a id="open-app" href="https://www.daengdabang.com/app/?source=pwa-repair&amp;shell=4" hidden>최신 앱 홈 열기</a>
            <button id="retry" type="button" hidden>다시 시도</button>
        </div>
    </main>
    <script>
        (() => {
            const release = "20260813-4";
            const repairOrigins = [
                "https://www.daengdabang.com",
                "https://daengdabang.com",
                "https://daengdabang.pages.dev",
            ];
            const params = new URLSearchParams(location.search);
            const requestedStep = Number.parseInt(params.get("step") || "0", 10);
            const step = Number.isFinite(requestedStep) && requestedStep >= 0 ? requestedStep : 0;
            const status = document.getElementById("status");
            const openApp = document.getElementById("open-app");
            const retry = document.getElementById("retry");

            const showComplete = () => {
                status.textContent = "두 운영 주소와 이전 설치 주소까지 모두 정리했습니다. 최신 앱 홈을 연 뒤 기존 바로가기 앱을 완전히 닫았다가 다시 열어 주세요.";
                openApp.href = `https://www.daengdabang.com/app/?source=pwa-repair&shell=4&v=${release}`;
                openApp.hidden = false;
                retry.hidden = true;
            };

            const repairCurrentOrigin = async () => {
                if (!("serviceWorker" in navigator)) {
                    throw new Error("이 브라우저에서는 자동 새로고침을 지원하지 않습니다.");
                }

                status.textContent = `이전 앱 화면을 정리하고 있어요… (${step + 1}/${repairOrigins.length})`;
                if ("caches" in window) {
                    const names = await caches.keys();
                    await Promise.all(names.map((name) => caches.delete(name)));
                }

                const registrations = await navigator.serviceWorker.getRegistrations();
                await Promise.all(registrations.map((registration) => registration.unregister()));

                status.textContent = `최신 앱 화면을 연결하고 있어요… (${step + 1}/${repairOrigins.length})`;
                const registration = await navigator.serviceWorker.register(`/sw.js?release=${release}`, {
                    scope: "/",
                    updateViaCache: "none",
                });
                await registration.update();
                await navigator.serviceWorker.ready;
            };

            const repair = async () => {
                if (params.get("done") === "1") {
                    showComplete();
                    return;
                }

                const expectedOrigin = repairOrigins[step];
                if (expectedOrigin && location.origin !== expectedOrigin) {
                    location.replace(`${expectedOrigin}/pwa-refresh?step=${step}&v=${release}`);
                    return;
                }

                await repairCurrentOrigin();

                const nextStep = step + 1;
                if (nextStep < repairOrigins.length) {
                    location.replace(`${repairOrigins[nextStep]}/pwa-refresh?step=${nextStep}&v=${release}`);
                    return;
                }

                location.replace(`${repairOrigins[0]}/pwa-refresh?done=1&v=${release}`);
            };

            retry.addEventListener("click", () => {
                location.replace(`${repairOrigins[0]}/pwa-refresh?step=0&v=${release}&retry=${Date.now()}`);
            });

            repair().catch((error) => {
                status.textContent = `${error.message} 바로가기를 만든 브라우저에서 이 페이지를 다시 열어 주세요.`;
                retry.hidden = false;
            });
        })();
    </script>
</body>
</html>
