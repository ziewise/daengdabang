name: Native package validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/native-store-packaging-20260822
      - codex/android-open-fix-20260831

permissions:
  contents: read

jobs:
  android:
    name: Android API 36 installable package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install web dependencies
        run: npm ci

      - name: Build and sync native assets
        run: npm run native:sync

      - name: Build debug Android App Bundle and installable APK
        working-directory: android
        run: ./gradlew :app:bundleDebug :app:assembleDebug --stacktrace

      - name: Verify APK signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          "$build_tools/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/app-debug-badging.txt

      - name: Verify the installed app opens and stays alive
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            package_name="com.daengdabang.app"
            apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
            adb logcat -c
            adb install -r "$apk_path"
            adb shell am force-stop "$package_name"
            adb shell am start -W -n "$package_name/.MainActivity" | tee android/app/build/outputs/apk/debug/app-debug-launch.txt
            sleep 5
            if ! adb shell pidof "$package_name" > /dev/null; then
              adb logcat -d -v threadtime > android/app/build/outputs/apk/debug/app-debug-logcat.txt
              cat android/app/build/outputs/apk/debug/app-debug-logcat.txt
              exit 1
            fi
            adb shell dumpsys activity activities | grep -F "$package_name/.MainActivity" | tee -a android/app/build/outputs/apk/debug/app-debug-launch.txt
            adb logcat -d -v threadtime '*:E' > android/app/build/outputs/apk/debug/app-debug-logcat.txt

      - uses: actions/upload-artifact@v4
        with:
          name: daengdabang-android-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug-badging.txt
            android/app/build/outputs/apk/debug/app-debug-launch.txt
            android/app/build/outputs/apk/debug/app-debug-logcat.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: daengdabang-android-debug-aab
          path: android/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build and sync native assets
        run: npm run native:sync

      - name: Build unsigned simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath ios/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package simulator build
        run: ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app daengdabang-ios-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: daengdabang-ios-simulator
          path: daengdabang-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
