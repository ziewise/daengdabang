name: Native package validation
on:
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  audit:
    name: Signed APK frame timing comparison
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/android-frame-audit.py
          sparse-checkout-cone-mode: false
      - run: python3 -m pip install perfetto
      - run: python3 scripts/android-frame-audit.py download
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          emulator-options: -no-window -gpu lavapipe -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -Vulkan
          disable-animations: true
          script: python3 scripts/android-frame-audit.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-apk-frame-audit
          path: audit/
          retention-days: 14
