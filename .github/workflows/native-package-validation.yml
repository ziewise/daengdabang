name: Native package validation
on:
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  compare:
    name: Compare APKs with ${{ matrix.gpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gpu: [swiftshader, swangle, lavapipe]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/compare-android-renderers.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43477332143
          name: daengdabang-android-signed-release
          path: candidate
      - name: Download unchanged public baseline
        run: python3 scripts/compare-android-renderers.py download
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -Vulkan
          disable-animations: true
          script: python3 scripts/compare-android-renderers.py ${{ matrix.gpu }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-comparison-${{ matrix.gpu }}
          path: verification/
          retention-days: 14
