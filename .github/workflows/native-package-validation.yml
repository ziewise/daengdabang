name: Native package validation

on:
  workflow_dispatch:
    inputs:
      release:
        description: Unused by this isolated public APK verification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  public-apk:
    name: Verify public Android APK and brand story
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/verify-public-android.py
          sparse-checkout-cone-mode: false
      - name: Download the published APK and verify its checksum
        run: python3 scripts/verify-public-android.py download
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the released app on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/verify-public-android.py verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-android-ui-verification
          path: verification/
          retention-days: 14
