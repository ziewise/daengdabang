#
# GitHub Pages 자동 배포 워크플로우 (Next.js 정적 export)
# ---------------------------------------------------------------------
# main 브랜치 push 시 자동 빌드 -> GitHub Pages 로 배포.
# Settings -> Pages -> Source 를 "GitHub Actions" 로 설정해야 동작.
#
# next.config.ts 의 output: 'export' 가 켜져 있어야 out/ 산출됨.
# public/CNAME 에 도메인이 적혀 있으면 빌드 시 out/CNAME 으로 복사되어
# GitHub Pages 가 Custom domain 으로 인식.
#

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_STOREFRONT_ASSET_COMMIT_SHA: ${{ github.sha }}
      # The site key is a public browser identifier. A repository variable can
      # override it, while the production widget keeps deploys fail-closed.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAAD8Fivq7ZEMUPPwX' }}
        # Recommendation v1 is launched; repository variables remain immediate
        # per-surface rollback switches. NEXT_PUBLIC values are frozen at build.
        NEXT_PUBLIC_RECOMMENDATION_V1_ENGINE: ${{ vars.NEXT_PUBLIC_RECOMMENDATION_V1_ENGINE || 'true' }}
        NEXT_PUBLIC_RECOMMENDATION_V1_FULL_PAGE: ${{ vars.NEXT_PUBLIC_RECOMMENDATION_V1_FULL_PAGE || 'true' }}
        NEXT_PUBLIC_RECOMMENDATION_V1_PREFERENCES: ${{ vars.NEXT_PUBLIC_RECOMMENDATION_V1_PREFERENCES || 'true' }}
        NEXT_PUBLIC_RECOMMENDATION_V1_ANALYTICS: ${{ vars.NEXT_PUBLIC_RECOMMENDATION_V1_ANALYTICS || 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # The regression suite imports bounded, framework-free .ts helpers
          # directly; pin the same native type-stripping runtime used locally.
          node-version: 24.14.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Verify pet companion frame quality
        run: |
          python -m pip install Pillow==12.2.0
          python tools/verify_pet_companion_breed_atlases.py
          python tools/verify_goods_image_budget.py

      - name: Run storefront regression tests
        run: npm test

      - name: Verify production signup challenge key
        run: node scripts/verify-turnstile-site-key.mjs

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify production signup challenge output
        run: node scripts/verify-turnstile-build-output.mjs

      - name: Verify goods contest performance output
        run: node scripts/verify-goods-contest-build-output.mjs

      - name: Prepare Pages artifact
        run: node scripts/prepare-pages-artifact.mjs --out out --max-bytes 950000000

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
