name: Isolated external launch load test
on:
  workflow_dispatch:
  push:
    branches: [fix/launch-readiness-20261116]
    paths:
      - scripts/launch-load-test.py
      - scripts/launch-load-profile.json
      - .github/workflows/launch-load-test.yml
permissions:
  contents: read
concurrency:
  group: isolated-external-launch-test
  cancel-in-progress: false
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aiohttp==3.14.5 pillow==12.0.0
      - name: External mixed journeys (isolated data; simulated PSP)
        env:
          DDB_LAB_BASE: ${{ vars.DDB_LAUNCH_LAB_BASE }}
          DDB_LAB_TOKEN: ${{ secrets.DDB_LAUNCH_LAB_TOKEN }}
        run: python scripts/launch-load-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-mixed-load-${{ github.run_id }}
          path: launch-load-result.json
          if-no-files-found: warn
